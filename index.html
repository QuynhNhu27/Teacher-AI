<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Teacher AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lexend:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Bố cục: ba cột — hộp bút (danh sách môn) | trang vở có lề số dòng | khung hỏi AI. Điện thoại: ngăn kéo trái + tấm trượt dưới. */
:root{
  --bg:#F6F5FB; --surface:#FFFFFF; --sunk:#EFEDF7; --ink:#28263A; --muted:#6B6782; --line:#E3E0EE;
  --accent:#6E56CF; --on-accent:#FFFFFF; --accent-soft:#ECE6FF;
  --mint:#D4F2E4; --mint-ink:#1D6A4B; --peach:#FFE0D0; --peach-ink:#8C4424;
  --sky:#D6E8FF; --sky-ink:#22508A; --lilac:#E8DEFF; --lilac-ink:#563B9C;
  --butter:#FFF1BD; --butter-ink:#735800; --pink:#FFDDEA; --pink-ink:#8E2F55;
  --hl:#FFE45C; --hl-ink:#28263A; --ok:#1F8A5B; --bad:#C2415B;
  --shadow:0 1px 2px rgba(40,38,58,.06),0 6px 20px rgba(40,38,58,.07);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;
  --r:14px;
  --board:#22392F; --board-ink:#F2EFE4; --chalk-y:#F4D35E; --chalk-p:#F6A6C1; --chalk-b:#9AD1F5; --chalk-g:#A8E6B8; --board-dot:rgba(255,255,255,.05);
  --f-hand:"Mali","Be Vietnam Pro",system-ui,sans-serif;
  --term-bg:#1E1C29; --term-fg:#E9E6F5; --term-err:#FF9DB0; --term-dim:#9C97B3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161F; --surface:#211F2B; --sunk:#1B1A24; --ink:#ECEAF5; --muted:#A39FB8; --line:#34313F;
  --accent:#AD9BFF; --on-accent:#17161F; --accent-soft:#2D2647;
  --mint:#1E3A30; --mint-ink:#9BE3C3; --peach:#43291E; --peach-ink:#FFC2A6;
  --sky:#1D2E48; --sky-ink:#A9CCFF; --lilac:#2F2650; --lilac-ink:#CDBDFF;
  --butter:#3B3315; --butter-ink:#FFE48A; --pink:#45232F; --pink-ink:#FFB6CE;
  --hl:#E8CB45; --hl-ink:#1D1A10; --ok:#6FD3A3; --bad:#FF8FA6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161F; --surface:#211F2B; --sunk:#1B1A24; --ink:#ECEAF5; --muted:#A39FB8; --line:#34313F;
  --accent:#AD9BFF; --on-accent:#17161F; --accent-soft:#2D2647;
  --mint:#1E3A30; --mint-ink:#9BE3C3; --peach:#43291E; --peach-ink:#FFC2A6;
  --sky:#1D2E48; --sky-ink:#A9CCFF; --lilac:#2F2650; --lilac-ink:#CDBDFF;
  --butter:#3B3315; --butter-ink:#FFE48A; --pink:#45232F; --pink-ink:#FFB6CE;
  --hl:#E8CB45; --hl-ink:#1D1A10; --ok:#6FD3A3; --bad:#FF8FA6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.25;margin:0}

/* Thanh trên */
.top{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.brand b{color:var(--accent);font-weight:700}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:0}
.top .sp{flex:1}
.pill{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--mint);color:var(--mint-ink)}
.pill.warn{background:var(--butter);color:var(--butter-ink)}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.ibtn:hover{border-color:var(--accent)}
.only-narrow{display:none}

/* Khung ba cột */
.app{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;padding-bottom:12px}
.col{min-height:0;overflow:auto;border-radius:var(--r);scrollbar-width:thin;scrollbar-color:transparent transparent}
.col:hover,.src:hover,.msgs:hover{scrollbar-color:var(--line) transparent}
.src,.msgs{scrollbar-width:thin;scrollbar-color:transparent transparent}
.col::-webkit-scrollbar,.src::-webkit-scrollbar,.msgs::-webkit-scrollbar{width:6px;height:6px}
.col::-webkit-scrollbar-button,.src::-webkit-scrollbar-button,.msgs::-webkit-scrollbar-button{display:none}
.col::-webkit-scrollbar-thumb,.src::-webkit-scrollbar-thumb,.msgs::-webkit-scrollbar-thumb{background:transparent;border-radius:6px}
.col:hover::-webkit-scrollbar-thumb,.src:hover::-webkit-scrollbar-thumb,.msgs:hover::-webkit-scrollbar-thumb{background:var(--line)}
#side{background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px}
#main{padding:2px 8px 40px}
#main>*{max-width:960px;margin-left:auto;margin-right:auto;width:100%}
#chat{background:var(--surface);border:1px solid var(--line);flex-direction:column;overflow:hidden;display:none;position:fixed;z-index:40;
  right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));height:min(620px,calc(100vh - 120px));border-radius:18px;box-shadow:0 12px 40px rgba(20,18,30,.22)}
body.chat-open #chat{display:flex}
body.chat-wide #chat{width:min(680px,calc(100vw - 32px));height:calc(100vh - 120px)}

.btn{border:0;border-radius:10px;padding:8px 13px;font-weight:600;font-size:.88rem;background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.06)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.danger{background:var(--pink);color:var(--pink-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sublist{display:flex;flex-direction:column;gap:4px}
.sub{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.sub:hover{background:var(--sunk)}
.sub.on{background:var(--accent-soft)}
.sub .dot{width:12px;height:12px;border-radius:4px;flex:none}
.sub .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub .ct{font-size:.75rem;color:var(--muted)}
.les{display:flex;gap:8px;align-items:flex-start;padding:6px 10px 6px 12px;border-radius:9px;border:0;background:transparent;text-align:left;width:100%;font-size:.9rem;color:var(--ink)}
.les:hover{background:var(--sunk)}
.les.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.lessons{display:flex;flex-direction:column;gap:2px;margin:4px 0 10px 16px;padding-left:8px;border-left:2px solid var(--line)}
.les .st{flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:10px;line-height:1}
.les .st.gen{border-color:var(--accent)}
.les .st.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.les .tl{flex:1;min-width:0}

/* màu theo loại môn */
.t-mint{background:var(--mint);color:var(--mint-ink)}
.t-peach{background:var(--peach);color:var(--peach-ink)}
.t-sky{background:var(--sky);color:var(--sky-ink)}
.t-lilac{background:var(--lilac);color:var(--lilac-ink)}
.t-butter{background:var(--butter);color:var(--butter-ink)}
.t-pink{background:var(--pink);color:var(--pink-ink)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px}

/* Đầu môn + tab */
.shead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.shead h1{font-size:1.45rem}
.meta{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto;margin-bottom:18px;position:sticky;top:0;z-index:5;box-shadow:0 -10px 0 8px var(--bg)}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .n{font-size:.72rem;margin-left:4px;padding:1px 6px;border-radius:99px;background:var(--hl);color:var(--hl-ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.status{display:flex;gap:10px;align-items:center;background:var(--sky);color:var(--sky-ink);padding:10px 14px;border-radius:12px;font-size:.9rem;margin-bottom:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* Bài học */
.lh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.lh h2{font-size:1.2rem}
.lh .rg{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.sec{border-radius:var(--r);padding:14px 16px;background:var(--surface);border:1px solid var(--line)}
.sec>.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec>.sh h3{font-size:.95rem}
.sec ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.sec p{margin:0}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.term{background:var(--sunk);border-radius:10px;padding:9px 12px}
.term b{display:block}
.term .doc{font-size:.82rem;color:var(--muted)}
.term .mn{font-size:.9rem}
.exttl{font-weight:600;margin:12px 0 6px;font-size:.92rem}
.exttl:first-of-type{margin-top:0}
.ex{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ex-row{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);border-top:1px dashed var(--line)}
.ex-row:first-child{border-top:0}
.ex-row .gl{padding:8px 12px;font-size:.92rem;background:var(--sunk);border-left:1px solid var(--line)}
.ln{padding:8px 12px;cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;transition:background .15s}
.ln:hover{background:color-mix(in srgb,var(--hl) 25%,transparent)}
.ln .no{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:2.2em;text-align:right;flex:none}
.ln .tx{flex:1;min-width:0;word-break:break-word}
.ln.mono .tx{font-family:var(--f-mono);font-size:.87rem;white-space:pre-wrap}
.ln .doc{flex-basis:100%;padding-left:calc(2.2em + 10px);font-size:.84rem;color:var(--muted);font-style:italic}
.ln.hl,.ln.hl:hover{background:var(--hl);color:var(--hl-ink)}
.ln.hl .no,.ln.hl .doc{color:var(--hl-ink);opacity:.75}
.qa{border-top:1px dashed var(--line);padding:8px 0}
.qa:first-of-type{border-top:0}
.qa summary{cursor:pointer;font-weight:500}
.qa .ans{margin-top:6px;padding:8px 12px;border-radius:9px;background:var(--mint);color:var(--mint-ink);font-size:.92rem}
details.src-wrap>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.src-wrap>summary::-webkit-details-marker{display:none}
.src{margin-top:10px;border:1px solid var(--line);border-radius:12px;max-height:560px;overflow:auto;background:var(--surface)}
.src .ln{padding:6px 12px;border-bottom:1px solid var(--line);line-height:1.55}
.src .ln:last-child{border-bottom:0}
.src .ln.mono{background:var(--sunk)}
.src .ln.mono.hl{background:var(--hl)}
.src .ln .tx{white-space:pre-wrap}
.src .ln.mono .tx{font-size:.85rem}
.note{font-size:.85rem;color:var(--muted)}
.miss{background:var(--pink);color:var(--pink-ink);border-radius:10px;padding:10px 12px;font-size:.88rem}
.empty{text-align:center;padding:30px 18px}
.empty h2{font-size:1.25rem;margin-bottom:6px}

/* Độ phủ */
.meter{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.big{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.tw{overflow-x:auto}

/* Luyện */
.pi{display:flex;flex-direction:column;gap:10px}
.pi .kind{align-self:flex-start}
.code{font-family:var(--f-mono);font-size:.87rem;background:var(--sunk);border-radius:10px;overflow:auto}
.code .ln{padding:4px 12px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;min-height:70px}
textarea.code-ed{font-family:var(--f-mono);font-size:.87rem;min-height:110px;white-space:pre;background:var(--sunk)}
.fb{border-radius:10px;padding:10px 12px;font-size:.92rem;white-space:pre-wrap}
.fb.ok{background:var(--mint);color:var(--mint-ink)}
.fb.bad{background:var(--pink);color:var(--pink-ink)}
.fb.info{background:var(--sky);color:var(--sky-ink)}

/* Ôn tập */
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:110px}
.bx{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bx i{display:block;width:100%;border-radius:8px 8px 3px 3px;min-height:4px}
.bx small{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:28px;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.flash .fr{white-space:pre-line;font-family:var(--f-display);font-size:1.3rem;font-weight:600}
.flash .bk{font-size:1.05rem;max-width:52ch}
.flash .src-n{font-size:.78rem;color:var(--muted)}
.prog{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Chat */
.ch-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ch-h h3{font-size:1rem;flex:1}
.selbox{flex:none;margin:10px 14px 0;padding:8px 30px 8px 12px;border-radius:10px;background:var(--hl);color:var(--hl-ink);font-size:.88rem;position:relative}
.selbox .q{font-family:var(--f-mono);font-size:.8rem;line-height:1.45;white-space:pre-wrap;max-height:4.4em;overflow:auto}
.selbox .x{position:absolute;top:4px;right:6px;border:0;background:transparent;color:inherit;font-size:1rem}
.msgs{flex:1;min-height:140px;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:94%;padding:10px 13px;border-radius:12px;font-size:.93rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--sunk)}
.msg .qt{display:block;font-size:.78rem;opacity:.75;border-left:3px solid var(--hl);padding-left:6px;margin-bottom:4px;white-space:pre-wrap}
.ch-f{flex:none;padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end}
.ch-f textarea{flex:1;min-width:0;height:46px;min-height:46px;max-height:160px;resize:none;line-height:1.45;padding:11px 12px;overflow-y:auto}
.ch-f .btn{height:46px;flex:none}
.sugs{flex:none;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sug{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:.8rem}
.sug:hover{border-color:var(--accent)}

/* Hộp thoại thêm môn */
.ov{position:fixed;inset:0;background:rgba(20,18,30,.45);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:18px;width:min(620px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.dlg h2{font-size:1.3rem}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:600;font-size:.88rem}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types input{position:absolute;opacity:0;pointer-events:none}
.types label{padding:7px 12px;border-radius:99px;border:2px solid transparent;font-weight:600;font-size:.85rem;cursor:pointer}
.types input:checked+label{border-color:currentColor}
.types input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:.88rem}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;
  padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:.9rem;box-shadow:var(--shadow);max-width:min(92vw,520px)}
.toast.bad{background:var(--bad);color:#fff}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;border:0;
  border-radius:99px;padding:13px 20px 13px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow)}
.fab.hasSel{background:var(--hl);color:var(--hl-ink)}
.scrim{position:fixed;inset:0;background:rgba(20,18,30,.35);z-index:35}

.seg{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:600;font-size:.86rem;color:var(--muted)}

function makeLocal(){const mem={};const k=id=>"htd:"+id;
  return {kind:"local",
    async get(id){try{const v=localStorage.getItem(k(id));if(v)return JSON.parse(v)}catch(e){}return mem[id]??null},
    async set(id,d){mem[id]=d;try{localStorage.setItem(k(id),JSON.stringify(d))}catch(e){}},
    async del(id){delete mem[id];try{localStorage.removeItem(k(id))}catch(e){}},
    async listSubjects(){const out={};try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.startsWith("htd:sub_"))out[key.slice(4)]=JSON.parse(localStorage.getItem(key))}}catch(e){}
      for(const id in mem)if(id.startsWith("sub_")&&!out[id])out[id]=mem[id];return Object.values(out)}};}
function makeDb(db,uid){const col=db.collection("data/users/"+uid);
  return {kind:"db",
    async get(id){const s=await col.doc(id).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null},
    async set(id,d){await col.doc(id).set(d)},
    async del(id){await col.doc(id).delete()},
    async listSubjects(){const q=await col.where("kind","==","subject").get();return q.docs.map(d=>JSON.parse(JSON.stringify(d.data())))}};}
const Q={};

function loadScript(src,test){return new Promise((ok,no)=>{if(test())return ok();const s=document.createElement("script");s.src=src;s.onload=()=>ok();s.onerror=()=>no(new Error("Không tải được thư viện đọc file"));document.head.appendChild(s)})}
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function openPdf(f){await loadScript(PDFJS+"pdf.worker.min.js",()=>window.pdfjsWorker);await loadScript(PDFJS+"pdf.min.js",()=>window.pdfjsLib);
  return await window.pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise}
async function pdfLines(pdf,p){const tc=await (await pdf.getPage(p)).getTextContent();let line="",lastY=null;const ls=[];
  for(const it of tc.items){const y=it.transform?Math.round(it.transform[5]):null;if(lastY!==null&&y!==lastY){ls.push(line);line=""}line+=it.str;lastY=y;if(it.hasEOL){ls.push(line);line="";lastY=null}}
  if(line)ls.push(line);return ls}
function stripNoise(pages){const cnt={};pages.forEach(ls=>new Set(ls.map(l=>l.trim())).forEach(l=>{cnt[l]=(cnt[l]||0)+1}));
  const lim=Math.max(3,Math.ceil(pages.length*0.3));
  return pages.map(ls=>ls.filter(l=>{const t=l.trim();if(!t)return false;
    if(t.length<16&&/\d/.test(t)&&/^[\s\d\-–—\/.()]*(ページ|頁|page|trang|p\.)?[\s\d\-–—\/.()]*$/i.test(t))return false;
    if(pages.length>=4&&cnt[t]>=lim&&t.length<60)return false;return true}))}
async function canvasBlob(c,maxBytes){let q=0.85,b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));
  while(maxBytes&&b&&b.size>maxBytes&&q>0.4){q-=0.15;b=await new Promise(r=>c.toBlob(r,"image/jpeg",q))}return b}
async function pageBlob(pdf,p,maxBytes){const page=await pdf.getPage(p);const v0=page.getViewport({scale:1});const scale=Math.min(2.2,1800/Math.max(v0.width,v0.height));
  const vp=page.getViewport({scale});const c=document.createElement("canvas");c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:x,viewport:vp}).promise;return canvasBlob(c,maxBytes)}
async function imageBlob(f,maxBytes){const bmp=await createImageBitmap(f);const s=Math.min(1,1800/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return canvasBlob(c,maxBytes)}
const OCR_PROMPT=n=>`Đây là ${n} trang ảnh của một giáo trình, theo đúng thứ tự. Hãy chép lại NGUYÊN VĂN toàn bộ chữ trên các trang.
- Giữ xuống dòng, đề mục, danh sách. Bảng: mỗi hàng một dòng, các ô cách nhau bằng " | ".
- Giữ nguyên ngôn ngữ gốc (chữ Nhật, tiếng Anh, code, công thức).
- Kanji có furigana: ghi kanji rồi furigana trong ngoặc, ví dụ 学生(がくせい).
- Bỏ watermark, tên website, số trang, header/footer lặp lại.
- Không dịch, không giải thích, không thêm chữ nào khác.`;
async function ocr(getBlob,count,progress){
  if(!S.ai||!S.imgLim)throw new Error("Giáo trình này là ảnh scan, không có lớp chữ. AI chỉ đọc được ảnh khi trang mở trong claude.ai. Bạn cũng có thể dán chữ vào ô bên dưới.");
  const per=Math.max(1,Math.min(3,S.imgLim.maxCount||1));const out=[];
  for(let i=0;i<count;i+=per){progress&&progress(`AI đang đọc ảnh trang ${i+1}–${Math.min(count,i+per)} / ${count}…`);
    const blobs=[];for(let k=i;k<Math.min(count,i+per);k++)blobs.push(await getBlob(k));
    const r=await S.ai(OCR_PROMPT(blobs.length),{images:blobs,modelTier:"default"});out.push(String(r.text||"").trim())}
  return out.join("\n")}
async function readFile(f,opt,progress){

async function pPhu(sub){
  const lines=await getLines(sub),c=coverage(sub,lines);const bs=sortedBai(sub);
  const pct=x=>c.content?Math.round(x/c.content*100):0;const gapN=c.gaps.reduce((a,g)=>a+g.den-g.tu+1,0);
  const lessonOf=m=>bs.find(b=>m.tu>=b.tu&&m.tu<=b.den);
  const rows=arr(sub.outline.muc).map(m=>{const b=lessonOf(m);let st,cl;
    if(!b){st="Không thuộc bài nào";cl="pink"}
    else if(!(sub.ready&&sub.ready[b.id])){st="Chưa giải nghĩa";cl="butter"}
    else if(arr(sub.miss&&sub.miss[b.id]).includes(m.id)){st="AI báo thiếu";cl="pink"}
    else{st="Đã phủ";cl="mint"}
    return `<tr><td>${esc(m.ten)}</td><td class="n">${m.tu}–${m.den}</td><td>${b?`<button class="sug" data-act="pick-les" data-bid="${b.id}">${bs.indexOf(b)+1}. ${esc(b.ten)}</button>`:"—"}</td><td><span class="chip t-${cl}">${st}</span></td></tr>`}).join("");
  const done=arr(sub.outline.muc).filter(m=>{const b=lessonOf(m);return b&&sub.ready&&sub.ready[b.id]&&!arr(sub.miss&&sub.miss[b.id]).includes(m.id)}).length;
  return `<div class="stack">
    <div class="card"><div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="label">Mục đã được giải nghĩa</div><div class="big">${done} / ${arr(sub.outline.muc).length}</div></div>
      <div style="text-align:right"><div class="label">Dòng chưa thuộc bài nào</div><div class="big" style="color:${gapN?"var(--bad)":"var(--ok)"}">${gapN}</div></div></div>
      <div class="meter" style="margin-top:12px" aria-label="Độ phủ theo dòng"><i style="width:${pct(c.gen)}%;background:var(--ok)"></i><i style="width:${pct(c.cov-c.gen)}%;background:var(--accent);opacity:.45"></i><i style="width:${pct(c.skip)}%;background:var(--muted);opacity:.35"></i><i style="width:${pct(gapN)}%;background:var(--bad)"></i></div>
      <div class="legend"><span style="--c:var(--ok)">Đã giải nghĩa ${pct(c.gen)}%</span><span style="--c:var(--accent)">Có bài, chưa giải nghĩa ${pct(c.cov-c.gen)}%</span><span style="--c:var(--muted)">Bỏ qua ${pct(c.skip)}%</span><span style="--c:var(--bad)">Chưa thuộc bài ${pct(gapN)}%</span></div></div>
    ${c.gaps.length?`<section class="sec"><div class="sh"><span class="chip t-pink">Đoạn có thể bị sót</span></div><div class="stack">${c.gaps.map(g=>`<div><div class="row" style="justify-content:space-between"><span class="note">Dòng ${g.tu}–${g.den}</span><button class="btn soft" data-act="extra-les" data-tu="${g.tu}" data-den="${g.den}">Tạo bài bổ sung</button></div><div class="src" style="max-height:160px">${(()=>{let o="";for(let i=g.tu;i<=Math.min(g.den,g.tu+8);i++)o+=lnHtml(lines[i-1]??"",i,sub.type==="lap_trinh");return o})()}</div></div>`).join("")}</div></section>`:""}
    ${arr(sub.outline.bo_qua).length?`<section class="sec"><div class="sh"><span class="chip t-sky">AI đã bỏ qua</span></div><ul>${arr(sub.outline.bo_qua).map(x=>`<li><span class="note">Dòng ${x.tu}–${x.den}:</span> ${esc(x.ly_do)}</li>`).join("")}</ul></section>`:""}
    <section class="sec"><div class="sh"><span class="chip t-lilac">Các mục trong giáo trình</span></div><div class="tw"><table class="tbl"><thead><tr><th>Mục</th><th>Dòng</th><th>Bài</th><th>Trạng thái</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="note">Chưa có mục.</td></tr>`}</tbody></table></div></section></div>`}

const MODES={ngoai_ngu:[["nhanh","Học nhanh"],["bt","Bài tập"],["nghe","Nghe & nói theo"],["chep","Nghe chép"],["viet","Tập viết"]],lap_trinh:[["bt","Bài tập"],["san","Sân code"]]};
function prOf(sub,bid){return (sub.pr&&sub.pr[bid])||{ok:[],n:0}}
const pkey=i=>S.sid+"/"+S.bid+"/"+i;
const normLoose=s=>String(s??"").normalize("NFKC").toLowerCase().replace(/[\s\p{P}\p{S}]/gu,"");

function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(n>1&&a.every((v,i)=>v===i))[a[0],a[1]]=[a[1],a[0]];return a}
async function pLuyen(sub){
  const bs=sortedBai(sub);let b=bs.find(x=>x.id===S.bid)||bs[0];if(!b)return `<div class="card empty"><p class="note">Chưa có bài nào để luyện.</p></div>`;S.bid=b.id;
  await getLines(sub);
  let modes=MODES[sub.type]||[["bt","Bài tập"]];if(sub.type==="ngoai_ngu"&&subLang(sub)==="ja-JP")modes=modes.concat([["kana","Bảng chữ cái"]]);if(!modes.some(m=>m[0]===S.pmode))S.pmode=modes[0][0];
  const sel=`<div class="row" style="justify-content:space-between"><div class="row"><label class="label" for="pracSel">Bài</label><select class="inp" id="pracSel" style="width:auto;max-width:100%">${bs.map((x,i)=>`<option value="${x.id}" ${x.id===b.id?"selected":""}>${i+1}. ${esc(x.ten)}</option>`).join("")}</select></div>
    ${modes.length>1?`<div class="seg" role="tablist">${modes.map(([k,n])=>`<button class="${S.pmode===k?"on":""}" data-act="pmode" data-m="${k}">${n}</button>`).join("")}</div>`:""}</div>`;
  let body;
  if(S.pmode==="nhanh")body=await mNhanh(sub,b);else if(S.pmode==="kana")body=mKana();else if(S.pmode==="nghe")body=await mNghe(sub,b);else if(S.pmode==="chep")body=await mChep(sub,b);else if(S.pmode==="viet")body=await mViet(sub,b);else if(S.pmode==="san")body=mSan(sub);else body=await mBaiTap(sub,b);
  return `<div class="stack">${sel}${body}</div>`}
const needLesson=()=>`<div class="card empty"><h2>Cần giải nghĩa bài trước</h2><p class="note">Phần này dùng các câu và từ đã được giải nghĩa trong bài.</p><button class="btn" data-act="gen-les" ${S.ai&&!S.busy?"":"disabled"}>Giải nghĩa bài này</button></div>`;
async function lessonLines(sub,b){const L=await getLesson(sub.sid,b.id);if(!L)return null;const out=[];arr(L.vi_du).forEach(v=>arr(v.dong).forEach(d=>{if(d&&d.t&&speakable(d.t))out.push(d)}));return out}

async function mBaiTap(sub,b){
  const k=sub.sid+"/"+b.id;if(!(k in S.prac)){const d=await get(`prac_${sub.sid}_${b.id}`);S.prac[k]=d?arr(d.items):null}
  const items=S.prac[k];
  const desc={lap_trinh:"Đoán kết quả → sắp xếp dòng code → tìm và sửa lỗi → tự viết code, từ dễ đến khó. Có gợi ý từng bước, JavaScript chạy thật, AI chấm code.",ngoai_ngu:"Điền từ, ghép câu, dịch hai chiều và tự đặt câu. AI chấm phần dịch và đặt câu."}[sub.type]||`Trắc nghiệm phủ mọi ý của bài${EXT(sub.type)?" và phần mở rộng hay thi":""}, điền từ, câu hỏi tự luận. AI chấm phần tự luận.`;
  if(!items)return `<div class="card empty"><h2>Chưa có bài tập</h2><p class="note">${desc}</p><button class="btn" data-act="gen-prac" ${S.ai&&!S.busy?"":"disabled"}>Tạo bài tập cho bài này</button></div>`;
  const p=prOf(sub,b.id),pc=Math.round(p.ok.length/Math.max(1,items.length)*100);
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><div class="label">Tiến độ luyện</div><div class="prog" id="pprog">Đã làm đúng ${p.ok.length}/${items.length} bài</div></div><span class="note">${desc}</span></div><div class="meter" style="margin-top:10px"><i id="pbar" style="width:${pc}%;background:var(--ok)"></i></div></div>
    ${items.map((it,i)=>itemHtml(sub,it,i,p.ok.includes(i))).join("")}
    <div class="row"><button class="btn ghost" data-act="gen-prac" ${S.ai&&!S.busy?"":"disabled"}>Tạo bộ bài tập mới</button></div>`}
const KIND={trac_nghiem:["sky","Trắc nghiệm"],doan_ket_qua:["mint","Đoán kết quả"],sap_xep:["sky","Sắp xếp dòng code"],sua_loi:["pink","Tìm và sửa lỗi"],viet_code:["lilac","Tự viết code"],dien_tu:["butter","Điền từ"],sap_xep_cau:["sky","Ghép câu"],dich:["peach","Dịch"],tu_luan:["lilac","Tự luận"]};

function parsonsHtml(it,i){const o=S.parsons[pkey(i)],L=arr(it.dong);return o.map((li,pos)=>`<div class="pl"><span class="tx">${esc(String(L[li]).trim())}</span><span class="mv"><button data-act="p-mv" data-i="${i}" data-pos="${pos}" data-d="-1" aria-label="Chuyển lên" ${pos?"":"disabled"}>↑</button><button data-act="p-mv" data-i="${i}" data-pos="${pos}" data-d="1" aria-label="Chuyển xuống" ${pos<o.length-1?"":"disabled"}>↓</button></span></div>`).join("")}

function itemHtml(sub,it,i,done){const kd=KIND[it.loai]||["sky","Bài tập"];const key=pkey(i);let inner="";const lang=sub.type==="ngoai_ngu";
  switch(it.loai){

  case "doan_ket_qua":inner=`<div class="code">${String(it.code||"").split("\n").map((l,j)=>lnHtml(l,j+1,true)).join("")}</div>

function qsPair(side,i){const it=QS.items[0],P=it.ps;if(!P||P.gone.includes(i))return;if(side===0)P.sl=i;else P.sr=i;
  if(P.sl!=null&&P.sr!=null){if(P.sl===P.sr){P.gone.push(P.sl);speak(it.pairs[P.sl].a);P.sl=P.sr=null;
      if(P.gone.length===it.pairs.length){it.tries=P.miss?1:0;it.show="Đã ghép đúng tất cả";it.explain=P.miss?`Sai ${P.miss} lần`:"";qsAnswer(true,-1);if(P.miss&&QS.firstOk&&it.tries)void 0;return}}
    else{P.miss++;P.bad=[P.sl,P.sr];beep(false);P.sl=P.sr=null;qsRender();setTimeout(()=>{P.bad=null;qsRender()},450);return}}
  qsRender()}
async function reviewAnswer(ok){const R=S.review;const cur=R.queue.shift();const c=cur.c;
  if(ok){if(!cur.tries){R.right++;addXP(2);c.box=Math.min(5,(c.box||1)+1);c.due=Date.now()+BOX[c.box-1]*DAY}}
  else{c.box=1;c.due=Date.now()+DAY;cur.tries++;R.queue.push(cur)}
  R.flip=false;put("cards_"+cur.sid,{kind:"cards",list:S.cards[cur.sid]});renderMain()}

document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(a){e.preventDefault();const f=ACT[a.dataset.act];if(f)f(a,e);return}
  const ln=e.target.closest(".ln");if(ln&&!e.target.closest("summary")){const s=getSelection&&getSelection().toString().trim();if(s&&s.length>1)return;
    if(ln.classList.contains("hl")){setSel(null);return}setSel(ln.dataset.t,ln)}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("ln")){e.preventDefault();setSel(e.target.dataset.t,e.target)}
  if(e.key==="Escape"){if($("#addOv"))$("#layer").innerHTML="";document.body.classList.remove("side-open","chat-open");scrim()}});
document.addEventListener("mouseup",selFromText);document.addEventListener("touchend",()=>setTimeout(selFromText,250));
function selFromText(){const s=getSelection&&getSelection();if(!s||s.isCollapsed)return;const t=s.toString().trim();if(t.length<2||t.length>1500)return;
  const n=s.anchorNode&&(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement);if(!n||!n.closest("#main"))return;setSel(t,null);
  const ln=n.closest(".ln");if(ln)ln.classList.add("hl")}
document.addEventListener("change",e=>{const id=e.target.id;
  if(id==="pracSel"){QS=null;S.bid=e.target.value;S.chepI=0;S.vietI=0;renderMain()}
  else if(id==="rate")S.rate=+e.target.value;
  else if(id==="mixVoice"){S.mixVoice=e.target.value==="1";try{localStorage.setItem("htd_mix",S.mixVoice?"1":"0")}catch(x){}if(VP.playing&&!VP.paused){VP.su=null;speechSynthesis.cancel();clearTimeout(VP.tm);VP.li=Math.max(-1,VP.li-1);VP.tm=setTimeout(vpStep,200)}vpRender()}
  else if(id==="rdVoice"){S.rdVoice=e.target.value;try{localStorage.setItem("htd_voice",S.rdVoice)}catch(x){}if(RD.playing&&!RD.paused){const it=RD.list[RD.i]||{};rdStart(RD.key,it.pi||0,it.ci||0)}}
  else if(id==="rdRate"){S.rdRate=+e.target.value;try{localStorage.setItem("htd_rate",S.rdRate)}catch(x){}if(VP.playing&&!VP.paused){VP.su=null;speechSynthesis.cancel();clearTimeout(VP.tm);VP.li=Math.max(-1,VP.li-1);VP.tm=setTimeout(vpStep,200)}if(RD.playing&&!RD.paused){const it=RD.list[RD.i]||{};rdStart(RD.key,it.pi||0,it.ci||0)}}
  else if(id==="hideTx"){S.hideTx=e.target.checked;renderMain()}
  else if(id==="tplTg"){S.showTpl=e.target.checked;drawWriteBg()}
  else if(id==="sanLang"){S.sanLang=e.target.value;S.sanCode=$("#sanEd").value;renderMain()}});
document.addEventListener("input",e=>{if(e.target.id==="sanEd")S.sanCode=e.target.value});
document.addEventListener("keydown",e=>{
  if(QS&&!QS.finished&&$("#qsBox")&&e.target.id!=="chatIn"){const typing=e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA";
    if(!typing&&/^[1-6]$/.test(e.key)){const b=document.querySelector(`#qsBox .qopt[data-j="${+e.key-1}"]`);if(b&&!b.disabled){e.preventDefault();b.click();return}}
    if(e.key==="Enter"&&!e.shiftKey){const n=$("#qsNext")||$("#qsCheck");if(n&&(typing?e.target.id==="qsIn":true)&&document.activeElement!==n){e.preventDefault();n.click();return}}}
  if(e.key==="Tab"&&!e.shiftKey&&e.target.classList&&e.target.classList.contains("code-ed")){e.preventDefault();const t=e.target,s=t.selectionStart;t.setRangeText("    ",s,t.selectionEnd,"end")}
  if(e.key==="Enter"&&e.target.id==="chepIn"){e.preventDefault();ACT["chep-check"]()}});
$("#chatForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#chatIn").value;$("#chatIn").value="";$("#chatIn").style.height="46px";sendChat(v)});
const grow=()=>{const t=$("#chatIn");t.style.height="46px";t.style.height=Math.min(160,t.scrollHeight+2)+"px"};
$("#chatIn").addEventListener("input",grow);
$("#chatIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#chatForm").requestSubmit()}});

/* ---------- khởi động ---------- */
try{const vv=localStorage.getItem("htd_voice");if(vv)S.rdVoice=vv;const rr=localStorage.getItem("htd_rate");if(rr&&["0.9","1","1.15","1.3"].includes(rr))S.rdRate=+rr;const mx=localStorage.getItem("htd_mix");if(mx)S.mixVoice=mx==="1"}catch(e){}
try{const th=localStorage.getItem("htd_theme");if(th)document.documentElement.dataset.theme=th;if(localStorage.getItem("htd_wide")){document.body.classList.add("chat-wide");$("#wideBtn").textContent="Thu nhỏ"}}catch(e){}
S.store=makeLocal();
S.subjects=[MEM.sub_mau];S.sid="mau";S.bid="b1";
renderMain();renderChat();
(async()=>{
  const use=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):async()=>null;
  const [db,user,ai]=await Promise.all([use("db"),use("user"),use("sample")]);
  S.ai=ai||null;
  if(S.ai){try{const l=await S.ai.limits();S.imgLim=l&&l.images?l.images:null}catch(e){}}
  try{if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{for(const k in VCACHE)delete VCACHE[k];speechSynthesis.getVoices()}}}catch(e){}
  let uid=null;try{uid=user?await user.id():null}catch(e){}
  const pill=$("#syncPill");
  if(db&&uid){S.store=makeDb(db,uid);pill.textContent="Đồng bộ theo tài khoản";pill.className="pill ok"}
  else{pill.textContent="Chỉ lưu trên máy này";pill.className="pill warn"}
  let list=[];try{list=await S.store.listSubjects()}catch(e){toast(errMsg(e),"bad")}
  list=list.filter(s=>s&&s.sid).sort((a,b)=>(a.created||0)-(b.created||0));
  S.subjects=list.concat([MEM.sub_mau]);loadStats();
  if(list.length){S.sid=list[list.length-1].sid;S.bid=null}
  renderMain();renderChat();
  if(!S.ai)toast("AI chỉ hoạt động khi mở trang trong claude.ai.");
})();
})();
