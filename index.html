<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teacher AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lexend:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button class="ibtn only-narrow" data-act="side-toggle" aria-label="Mở danh sách môn">☰ <span class="lbl">Môn học</span></button>
  <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 8l9-4 9 4-9 4z" fill="currentColor"/><path d="M7 10.5V15c0 1.4 2.2 3 5 3s5-1.6 5-3v-4.5M21 8v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span>Teacher <b>AI</b><small>Học giáo trình từng dòng</small></span></div>
  <span class="sp"></span>
  <span class="pill st" id="statPill" hidden></span>
  <span class="pill" id="syncPill">Đang kết nối…</span>
  <button class="ibtn" data-act="theme" id="themeBtn" aria-label="Đổi sáng/tối"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg><span class="lbl">Giao diện</span></button>
</header>

<div class="app">
  <aside class="col" id="side"></aside>
  <main class="col" id="main"></main>
  <aside class="col" id="chat">
    <div class="ch-h"><h3>Hỏi AI về bài</h3><button class="ibtn widebtn" data-act="chat-wide" id="wideBtn" aria-label="Mở rộng khung chat">Mở rộng</button><button class="ibtn" data-act="chat-toggle" aria-label="Thu gọn khung chat">Thu gọn</button></div>
    <div id="selWrap"></div>
    <div class="msgs" id="msgs"></div>
    <div class="sugs" id="sugs"></div>
    <form class="ch-f" id="chatForm">
      <textarea class="inp" id="chatIn" rows="1" placeholder="Hỏi AI về bài này…"></textarea>
      <button class="btn" type="submit" id="chatSend">Gửi</button>
    </form>
  </aside>
</div>
<button class="fab" id="fab" data-act="chat-toggle"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="fabTx">Hỏi AI</span></button>
<div id="layer"></div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai.js"></script>
<script src="js/doc-reader.js"></script>
<script src="js/course-data.js"></script>
<script src="js/render.js"></script>
<script src="js/speech.js"></script>
<script src="js/lesson.js"></script>
<script src="js/practice.js"></script>
<script src="js/xp.js"></script>
<script src="js/quick-learn.js"></script>
<script src="js/exam.js"></script>
<script src="js/flashcards.js"></script>
<script src="js/chat.js"></script>
<script src="js/ai-tasks.js"></script>
<script src="js/reader.js"></script>
<script src="js/video.js"></script>
<script src="js/add-course.js"></script>
<script src="js/events.js"></script>
<script src="js/sample-course.js"></script>
<script src="js/main.js"></script>
</body>
</html>
